name: Coordination claim

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, edited, synchronize, ready_for_review]

permissions:
  issues: read
  pull-requests: read

jobs:
  coordination-claim:
    name: coordination-claim
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate claim against issue #14
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          API = "https://api.github.com"
          OWNER, REPOSITORY = os.environ["GITHUB_REPOSITORY"].split("/", 1)
          TOKEN = os.environ["GITHUB_TOKEN"]
          ISSUE_NUMBER = 14
          ID_RE = re.compile(r"^[A-Z0-9]+(?:-[A-Z0-9]+)*$")
          CLAIM_RE = re.compile(r"(?im)^\s*claiming:\s*([A-Z0-9]+(?:-[A-Z0-9]+)*)\s*$")

          def fail(message):
              print(f"::error title=Coordination claim::{message}")
              sys.exit(1)

          def get_json(path):
              request = urllib.request.Request(
                  API + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {TOKEN}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  fail(f"Cannot verify the claim against issue #14 (HTTP {error.code}).")
              except (urllib.error.URLError, TimeoutError):
                  fail("Cannot reach GitHub to verify the claim against issue #14.")

          def open_work_ids(body):
              in_open_work = False
              result = set()
              for line in (body or "").splitlines():
                  if re.match(r"^##\s+Open work\b", line, re.IGNORECASE):
                      in_open_work = True
                      continue
                  if in_open_work and re.match(r"^##\s+", line):
                      break
                  if not in_open_work or not line.lstrip().startswith("|"):
                      continue
                  cells = [cell.strip() for cell in line.strip().strip("|").split("|")]
                  if len(cells) < 5:
                      continue
                  item_id = cells[0].strip(chr(96)).upper()
                  status = cells[-1].strip().lower()
                  if item_id != "ID" and ID_RE.fullmatch(item_id) and status.startswith("open"):
                      result.add(item_id)
              return result

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)
          pull = event.get("pull_request") or {}
          author = (pull.get("user") or {}).get("login") or ""
          title = pull.get("title") or ""
          body = pull.get("body") or ""
          clean_body = re.sub(r"<!--[\s\S]*?-->", "", body)
          submitted_text = title + "\n" + clean_body

          issue = get_json(f"/repos/{OWNER}/{REPOSITORY}/issues/{ISSUE_NUMBER}")
          work_ids = open_work_ids(issue.get("body") or "")
          if not work_ids:
              fail("Issue #14 has no readable open work-item IDs.")

          comments = []
          for page in range(1, 101):
              batch = get_json(
                  f"/repos/{OWNER}/{REPOSITORY}/issues/{ISSUE_NUMBER}/comments"
                  f"?per_page=100&page={page}"
              )
              comments.extend(batch)
              if len(batch) < 100:
                  break
          else:
              fail("Issue #14 has too many comments to verify safely.")

          candidate_ids = {
              item_id
              for item_id in work_ids
              if re.search(
                  rf"(?<![A-Za-z0-9_-]){re.escape(item_id)}(?![A-Za-z0-9_-])",
                  submitted_text,
                  re.IGNORECASE,
              )
          }

          claim_field = re.search(
              r"(?im)^Claimed in the coordination issue as:\s*(.*)$",
              clean_body,
          )
          if claim_field:
              link = re.search(r"#issuecomment-(\d+)", claim_field.group(1))
              if link:
                  linked_comment_id = link.group(1)
                  linked_comment = next(
                      (comment for comment in comments if str(comment.get("id")) == linked_comment_id),
                      None,
                  )
                  if linked_comment:
                      linked_claim = CLAIM_RE.search(linked_comment.get("body") or "")
                      if linked_claim and linked_claim.group(1).upper() in work_ids:
                          candidate_ids.add(linked_claim.group(1).upper())

          if len(candidate_ids) != 1:
              fail(
                  "Add exactly one open work-item ID from issue #14 to the PR title/body "
                  "(or link the claim comment) before requesting review."
              )

          item_id = next(iter(candidate_ids))
          matching_claims = []
          for comment in comments:
              for match in CLAIM_RE.finditer(comment.get("body") or ""):
                  if match.group(1).upper() == item_id:
                      matching_claims.append(comment)

          if not matching_claims:
              fail(f"No claiming comment was found for work item {item_id} on issue #14.")
          owners = {
              ((comment.get("user") or {}).get("login") or "").casefold()
              for comment in matching_claims
          }
          if len(owners) != 1 or author.casefold() not in owners:
              fail(f"Claim {item_id} must have one owner, matching the PR author.")
          print(f"Coordination claim verified for {item_id}.")
          PY