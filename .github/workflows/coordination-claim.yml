name: Coordination claim

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft, closed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: ["Coordination claim"]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: coordination-activity
  cancel-in-progress: false

jobs:
  validate-claim:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    name: coordination-claim
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Validate claim against issue #14
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime

          API = "https://api.github.com"
          OWNER, REPOSITORY = os.environ["GITHUB_REPOSITORY"].split("/", 1)
          TOKEN = os.environ["GITHUB_TOKEN"]
          ISSUE_NUMBER = 14
          WORK_ID_RE = re.compile(r"[A-Z0-9]+(?:-[A-Z0-9]+)+")
          CLAIM_LIST_RE = re.compile(
              r"^([A-Z0-9]+(?:-[A-Z0-9]+)+"
              r"(?:\s*,\s*[A-Z0-9]+(?:-[A-Z0-9]+)+)*)"
          )
          CLAIM_FIELD_RE = re.compile(
              r"(?im)^\s*>?\s*Claimed in the coordination issue as:\s*(.*?)\s*$"
          )
          BACKTICK = chr(96)

          def fail(message):
              safe = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Coordination claim::{safe}")
              sys.exit(1)

          def request_json(path):
              request = urllib.request.Request(
                  API + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {TOKEN}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  fail(f"Cannot verify the claim against issue #14 (HTTP {error.code}).")
              except (urllib.error.URLError, TimeoutError):
                  fail("Cannot reach GitHub to verify the claim against issue #14.")

          def get_collection(path):
              result = []
              for page in range(1, 101):
                  batch = request_json(f"{path}?per_page=100&page={page}")
                  if not isinstance(batch, list):
                      fail("GitHub returned an invalid issue #14 response.")
                  result.extend(batch)
                  if len(batch) < 100:
                      return result
              fail("Issue #14 has too many comments to verify safely.")

          def claim_ids_from_comment(body):
              lines = (body or "").splitlines()
              found = set()
              for index, line in enumerate(lines):
                  match = re.match(r"^\s*claiming:\s*(.*)$", line, re.IGNORECASE)
                  if not match:
                      continue
                  tail = match.group(1).strip()
                  listed = CLAIM_LIST_RE.match(tail)
                  if listed:
                      found.update(part.strip().upper() for part in listed.group(1).split(","))
                  elif re.match(r"^(the items below|a second batch)\b", tail, re.IGNORECASE):
                      for bullet in lines[index + 1:]:
                          if not re.match(r"^\s*[-*]\s+", bullet):
                              continue
                          found.update(re.findall(BACKTICK + r"([A-Z0-9]+(?:-[A-Z0-9]+)+)" + BACKTICK, bullet))
              return found

          def open_work_ids(body):
              in_open_work = False
              result = set()
              for line in (body or "").splitlines():
                  if re.match(r"^##\s+Open work\b", line, re.IGNORECASE):
                      in_open_work = True
                      continue
                  if in_open_work and re.match(r"^##\s+", line):
                      break
                  if not in_open_work or not line.lstrip().startswith("|"):
                      continue
                  cells = [cell.strip() for cell in line.strip().strip("|").split("|")]
                  if len(cells) < 5:
                      continue
                  item_id = cells[0].strip(BACKTICK).upper()
                  status = cells[-1].lower()
                  if item_id != "ID" and WORK_ID_RE.fullmatch(item_id) and status.startswith("open"):
                      result.add(item_id)
              return result

          def find_ids(text, allowed):
              text = text or ""
              return {
                  item_id
                  for item_id in allowed
                  if re.search(
                      rf"(?<![A-Za-z0-9-]){re.escape(item_id)}(?![A-Za-z0-9-])",
                      text,
                      re.IGNORECASE,
                  )
              }

          def parse_time(value):
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  return None

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)
          pull = event.get("pull_request") or {}
          author = ((pull.get("user") or {}).get("login") or "").casefold()
          opened_at = parse_time(pull.get("created_at"))
          if not author or opened_at is None:
              fail("Cannot determine the PR author or opening time.")

          issue = request_json(f"/repos/{OWNER}/{REPOSITORY}/issues/{ISSUE_NUMBER}")
          comments = get_collection(f"/repos/{OWNER}/{REPOSITORY}/issues/{ISSUE_NUMBER}/comments")
          comments_by_id = {str(comment.get("id")): comment for comment in comments}
          claims_by_id = {}
          for comment in comments:
              for item_id in claim_ids_from_comment(comment.get("body") or ""):
                  claims_by_id.setdefault(item_id, []).append(comment)

          work_ids = open_work_ids(issue.get("body") or "")
          allowed_ids = work_ids | set(claims_by_id)
          title = pull.get("title") or ""
          title_candidates = find_ids(title, allowed_ids)
          candidates = set(title_candidates)
          if not candidates:
              body = re.sub(r"<!--[\s\S]*?-->", "", pull.get("body") or "")
              field = CLAIM_FIELD_RE.search(body)
              if field:
                  value = field.group(1)
                  linked = re.search(r"#issuecomment-(\d+)", value)
                  if linked:
                      linked_comment = comments_by_id.get(linked.group(1))
                      if linked_comment:
                          candidates.update(
                              claim_ids_from_comment(linked_comment.get("body") or "") & allowed_ids
                          )
                  if not candidates:
                      candidates.update(find_ids(value, allowed_ids))

          if not candidates:
              fail(
                  "Put one or more item IDs from issue #14 in the PR title or "
                  "the 'Claimed in the coordination issue as' field."
              )

          owners = set()
          for item_id in sorted(candidates):
              prior_claims = []
              for comment in claims_by_id.get(item_id, []):
                  effective_at = parse_time(comment.get("updated_at") or comment.get("created_at"))
                  if effective_at is not None and effective_at < opened_at:
                      prior_claims.append(comment)
              claim_owners = {
                  ((comment.get("user") or {}).get("login") or "").casefold()
                  for comment in prior_claims
              }
              if not prior_claims:
                  fail(f"No claim for {item_id} was posted before the PR was opened.")
              if len(claim_owners) != 1:
                  fail(f"Claim {item_id} has multiple owners; resolve it in issue #14.")
              owners.update(claim_owners)

          if owners != {author}:
              fail("Every claim must have one owner, and that owner must match the PR author.")
          print("Coordination claim verified for " + ", ".join(sorted(candidates)) + ".")

  sync-activity:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.number == 14) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      github.event_name == 'workflow_dispatch'
    name: sync-issue-activity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Refresh the managed activity block in issue #14
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from collections import defaultdict
          from datetime import datetime, timezone

          API = "https://api.github.com"
          OWNER, REPOSITORY = os.environ["GITHUB_REPOSITORY"].split("/", 1)
          TOKEN = os.environ["GITHUB_TOKEN"]
          ISSUE_NUMBER = 14
          BEGIN = "<!-- BEGIN AUTO PR ACTIVITY -->"
          END = "<!-- END AUTO PR ACTIVITY -->"
          WORK_ID_RE = re.compile(r"[A-Z0-9]+(?:-[A-Z0-9]+)+")
          CLAIM_LIST_RE = re.compile(
              r"^([A-Z0-9]+(?:-[A-Z0-9]+)+"
              r"(?:\s*,\s*[A-Z0-9]+(?:-[A-Z0-9]+)+)*)"
          )
          CLAIM_FIELD_RE = re.compile(
              r"(?im)^\s*>?\s*Claimed in the coordination issue as:\s*(.*?)\s*$"
          )
          BACKTICK = chr(96)

          def stop(message):
              safe = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Coordination activity::{safe}")
              sys.exit(1)

          def api_json(path, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  API + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {TOKEN}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  stop(f"GitHub API request failed (HTTP {error.code}); issue #14 was not changed.")
              except (urllib.error.URLError, TimeoutError):
                  stop("Cannot reach GitHub; issue #14 was not changed.")

          def get_collection(path, label):
              result = []
              for page in range(1, 101):
                  batch = api_json(f"{path}?per_page=100&page={page}")
                  if not isinstance(batch, list):
                      stop(f"GitHub returned an invalid {label} response.")
                  result.extend(batch)
                  if len(batch) < 100:
                      return result
              stop(f"The {label} collection is too large to sync safely.")

          def claim_ids_from_comment(body):
              lines = (body or "").splitlines()
              found = set()
              for index, line in enumerate(lines):
                  match = re.match(r"^\s*claiming:\s*(.*)$", line, re.IGNORECASE)
                  if not match:
                      continue
                  tail = match.group(1).strip()
                  listed = CLAIM_LIST_RE.match(tail)
                  if listed:
                      found.update(part.strip().upper() for part in listed.group(1).split(","))
                  elif re.match(r"^(the items below|a second batch)\b", tail, re.IGNORECASE):
                      for bullet in lines[index + 1:]:
                          if not re.match(r"^\s*[-*]\s+", bullet):
                              continue
                          found.update(re.findall(BACKTICK + r"([A-Z0-9]+(?:-[A-Z0-9]+)+)" + BACKTICK, bullet))
              return found

          def open_work_ids(body):
              in_open_work = False
              result = set()
              for line in (body or "").splitlines():
                  if re.match(r"^##\s+Open work\b", line, re.IGNORECASE):
                      in_open_work = True
                      continue
                  if in_open_work and re.match(r"^##\s+", line):
                      break
                  if not in_open_work or not line.lstrip().startswith("|"):
                      continue
                  cells = [cell.strip() for cell in line.strip().strip("|").split("|")]
                  if len(cells) < 5:
                      continue
                  item_id = cells[0].strip(BACKTICK).upper()
                  status = cells[-1].lower()
                  if item_id != "ID" and WORK_ID_RE.fullmatch(item_id) and status.startswith("open"):
                      result.add(item_id)
              return result

          def find_ids(text, allowed):
              text = text or ""
              return {
                  item_id
                  for item_id in allowed
                  if re.search(
                      rf"(?<![A-Za-z0-9-]){re.escape(item_id)}(?![A-Za-z0-9-])",
                      text,
                      re.IGNORECASE,
                  )
              }

          def parse_time(value):
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  return None

          def evaluate_claim(pull, allowed_ids, claims_by_id, comments_by_id):
              author = ((pull.get("user") or {}).get("login") or "")
              opened_at = parse_time(pull.get("created_at"))
              if not author or opened_at is None:
                  return "invalid", set(), None, {}
              title_candidates = find_ids(pull.get("title") or "", allowed_ids)
              candidates = set(title_candidates)
              if not candidates:
                  body = re.sub(r"<!--[\s\S]*?-->", "", pull.get("body") or "")
                  field = CLAIM_FIELD_RE.search(body)
                  if field:
                      value = field.group(1)
                      linked = re.search(r"#issuecomment-(\d+)", value)
                      if linked:
                          linked_comment = comments_by_id.get(linked.group(1))
                          if linked_comment:
                              candidates.update(
                                  claim_ids_from_comment(linked_comment.get("body") or "") & allowed_ids
                              )
                      if not candidates:
                          candidates.update(find_ids(value, allowed_ids))
              if not candidates:
                  return "unclaimed", set(), None, {}

              owners = set()
              links = {}
              for item_id in sorted(candidates):
                  prior = []
                  for comment in claims_by_id.get(item_id, []):
                      effective_at = parse_time(comment.get("updated_at") or comment.get("created_at"))
                      if effective_at is not None and effective_at < opened_at:
                          prior.append(comment)
                  claim_owners = {
                      ((comment.get("user") or {}).get("login") or "").casefold()
                      for comment in prior
                  }
                  if not prior or len(claim_owners) != 1:
                      return "invalid", candidates, None, {}
                  owners.update(claim_owners)
                  prior.sort(key=lambda comment: comment.get("created_at") or "")
                  links[item_id] = str(prior[0].get("id") or "")
              if len(owners) != 1 or next(iter(owners)).casefold() != author.casefold():
                  return "invalid", candidates, None, {}
              return "claimed", candidates, author, links

          def safe_cell(value, limit=180):
              value = re.sub(r"[\r\n\t]+", " ", str(value or "")).strip()
              value = (
                  value.replace("\\", "\\\\")
                  .replace("|", "\\|")
                  .replace(BACKTICK, "\\" + BACKTICK)
                  .replace("[", "\\[")
                  .replace("]", "\\]")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
              )
              if len(value) > limit:
                  value = value[:limit - 3].rstrip() + "..."
              return value

          issue = api_json(f"/repos/{OWNER}/{REPOSITORY}/issues/{ISSUE_NUMBER}")
          comments = get_collection(
              f"/repos/{OWNER}/{REPOSITORY}/issues/{ISSUE_NUMBER}/comments",
              "issue #14 comments",
          )
          pulls = get_collection(
              f"/repos/{OWNER}/{REPOSITORY}/pulls",
              "open pull requests",
          )
          pulls = [pull for pull in pulls if pull.get("state") == "open"]
          comments_by_id = {str(comment.get("id")): comment for comment in comments}
          claims_by_id = defaultdict(list)
          for comment in comments:
              for item_id in claim_ids_from_comment(comment.get("body") or ""):
                  claims_by_id[item_id].append(comment)
          allowed_ids = open_work_ids(issue.get("body") or "") | set(claims_by_id)

          activity_rows = []
          for pull in pulls:
              status, item_ids, owner, links = evaluate_claim(
                  pull, allowed_ids, claims_by_id, comments_by_id
              )
              activity_rows.append((pull, status, item_ids, owner, links))

          groups = defaultdict(list)
          for row in activity_rows:
              pull = row[0]
              groups[((pull.get("user") or {}).get("login") or "unknown")].append(row)

          updated_at = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          section = [
              BEGIN,
              "## Current open pull request activity",
              "",
              f"Updated: **{updated_at}** — **{len(pulls)} open PRs** across **{len(groups)} submitters**.",
              "PR author is the submitter; it does not establish ownership. A linked claim is valid only when its issue #14 comment predates the PR and the claimant matches the author. Rows marked **Needs claim** require a valid claim. The action reports status only; it never closes or assigns a PR.",
              "",
              "Submitters are grouped below. The Action replaces only this marked block; all surrounding issue text remains editable.",
          ]
          for author in sorted(groups, key=str.casefold):
              author_rows = sorted(groups[author], key=lambda row: row[0].get("number", 0), reverse=True)
              section.extend([
                  "",
                  f"### @{safe_cell(author)} — {len(author_rows)} open PRs",
                  "",
                  "| PR | Claim / owner | Work (PR title) | State |",
                  "|---|---|---|---|",
              ])
              for pull, status, item_ids, owner, links in author_rows:
                  claim_cell = "Unclaimed"
                  if status == "invalid":
                      claim_cell = "Needs claim"
                  elif status == "claimed":
                      rendered = []
                      for item_id in sorted(item_ids):
                          comment_id = links.get(item_id)
                          comment_url = (
                              f"https://github.com/{OWNER}/{REPOSITORY}/issues/{ISSUE_NUMBER}"
                              f"#issuecomment-{comment_id}"
                          )
                          rendered.append(f"[{BACKTICK}{item_id}{BACKTICK}]({comment_url})")
                      claim_cell = ", ".join(rendered) + f" — @{safe_cell(owner)}"
                  pr_url = pull.get("html_url") or f"https://github.com/{OWNER}/{REPOSITORY}/pull/{pull.get('number')}"
                  pr_label = f"[#{pull.get('number')}]({pr_url})"
                  title = safe_cell(pull.get("title") or "")
                  state = "Draft" if pull.get("draft") else "Ready"
                  section.append(f"| {pr_label} | {claim_cell} | {title} | {state} |")
          section.append(END)
          managed_block = "\n".join(section)

          current_body = issue.get("body") or ""
          if current_body.count(BEGIN) != 1 or current_body.count(END) != 1:
              stop("Issue #14 must contain exactly one pair of activity markers; it was not changed.")
          start = current_body.index(BEGIN)
          end = current_body.index(END)
          if end < start:
              stop("Issue #14 activity markers are out of order; it was not changed.")
          end += len(END)
          new_body = current_body[:start] + managed_block + current_body[end:]
          if len(new_body) > 65536:
              stop("The activity table would exceed GitHub's issue-body limit; the prior table was kept.")
          if new_body == current_body:
              print(f"Issue #14 is already current ({len(pulls)} open PRs).")
          else:
              api_json(
                  f"/repos/{OWNER}/{REPOSITORY}/issues/{ISSUE_NUMBER}",
                  method="PATCH",
                  payload={"body": new_body},
              )
              print(f"Updated issue #14 with {len(pulls)} open PRs across {len(groups)} submitters.")
          PY
